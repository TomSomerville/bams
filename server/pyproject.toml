[project]
name = "bams"
version = "0.1.0"
description = "BAMS - Bad Ass Media Server"
readme = "README.md"
license = "MIT"
# Debian 12 ships 3.11; Ubuntu 24.04 / Mint 22 ship 3.12.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "guessit>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bams = "bams.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
