# Step 0 test app (docs/IOS-PLAN.md), thrown away after step 0. XcodeGen makes the Xcode project from this in CI.
name: BAMSSpike
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  BAMSSpike:
    type: application
    platform: iOS
    sources: [Spike]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.bams.spike
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: Spike/Spike.entitlements
    info:
      path: Spike/Info.plist
      properties:
        CFBundleDisplayName: BAMS test
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: BAMS talks to your BAMS server on your home network.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
